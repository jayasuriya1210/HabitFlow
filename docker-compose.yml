services:
  app:
    build: .
    container_name: habitflow-app
    ports:
      - "5001:5001"
    environment:
      - MONGO_URI=mongodb://mongo:27017/habitflow

    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: habitflow-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data: